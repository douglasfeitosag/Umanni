plugins:
  - rubocop-rails

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable
  Include:
    - "**/*.rb"
    - "**/*.rake"
    - "Gemfile"
    - "Rakefile"
    - ".simplecov"
  Exclude:
    - "vendor/**/*"
    - "node_modules/**/*"
    - "db/schema.rb"
    - "branding/**/*"

Style/Documentation:
  Enabled: false
Style/StringLiterals:
  EnforcedStyle: double_quotes
Style/FrozenStringLiteralComment:
  Enabled: false
Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "lib/tasks/**/*"
    - "config/**/*"

# Coverage consolidation must not boot Rails before loading SimpleCov.
Rails/RakeEnvironment:
  Exclude:
    - "lib/tasks/coverage.rake"
