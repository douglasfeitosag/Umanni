name: umanni-foundation
x-tooling: &tooling
  build:
    context: .
    target: tooling
    args:
      VERIFICATION_SHA: ${VERIFICATION_SHA:-}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-umanni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-umanni-local}
      POSTGRES_DB: umanni_development
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d umanni_development"]
      interval: 2s
      timeout: 5s
      retries: 20

  verify:
    <<: *tooling
    profiles: [test]
    environment:
      RAILS_ENV: test
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-umanni}:${POSTGRES_PASSWORD:-umanni-local}@db:5432/umanni_test
    command: ["bin/check"]

  dev:
    <<: *tooling
    profiles: [dev]
    environment:
      RAILS_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://umanni:umanni-local@db:5432/umanni_development}
      VITE_RUBY_HOST: vite
    volumes:
      - .:/rails
      - node_modules:/rails/node_modules
    ports: ["127.0.0.1:3030:3000"]
    command: ["bin/rails", "server", "-b", "0.0.0.0", "-p", "3000"]

  vite:
    <<: *tooling
    profiles: [dev]
    environment:
      RAILS_ENV: development
      VITE_RUBY_HOST: 0.0.0.0
      VITE_RUBY_PORT: 3036
    volumes:
      - .:/rails
      - node_modules:/rails/node_modules
    ports: ["127.0.0.1:3036:3036"]
    command: ["bundle", "exec", "vite", "dev"]

  jobs:
    <<: *tooling
    profiles: [dev]
    environment:
      RAILS_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://umanni:umanni-local@db:5432/umanni_development}
    volumes:
      - .:/rails
      - node_modules:/rails/node_modules
    command: ["bin/jobs"]

  web:
    profiles: [delivery]
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: ${DELIVERY_DATABASE_URL:-postgresql://umanni:umanni-local@db:5432/umanni_production}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      THRUSTER_LOG_REQUESTS: "false"
      UMANNI_DELIVERY_PREPARE_DATABASE: "1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/rails/storage
    ports: ["127.0.0.1:3030:3000"]
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/ready')).code == '200' ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    profiles: [delivery]
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: ${DELIVERY_DATABASE_URL:-postgresql://umanni:umanni-local@db:5432/umanni_production}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/rails/storage
    command: ["bin/jobs"]

volumes:
  database:
  node_modules:
  storage:
